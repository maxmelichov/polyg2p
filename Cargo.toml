[package]
name = "polyg2p"
version = "0.1.0"
edition = "2024"

[dependencies]
fst = "0.4.7"
memmap2 = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"

[dev-dependencies]
criterion = "0.8.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
